name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      stable: ${{ steps.release.outputs.stable }}
      image: ${{ steps.release.outputs.image }}
      standalone_artifact: ${{ steps.release.outputs.standalone_artifact }}
      release_notes: ${{ steps.release.outputs.release_notes }}

    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Require release commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate tag and release versions
        id: release
        run: >-
          node release/check-version.js
          --tag "$GITHUB_REF_NAME"
          --check-source
          --github-output "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx for immutable-target check
        uses: docker/setup-buildx-action@v3

      - name: Reject reuse of published release targets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
        run: |
          if release_lookup=$(gh release view "$GITHUB_REF_NAME" 2>&1); then
            echo "GitHub Release $GITHUB_REF_NAME already exists; immutable releases cannot be overwritten." >&2
            exit 1
          elif ! printf '%s' "$release_lookup" | grep -Eqi 'release not found|not found'; then
            echo "Could not safely determine whether GitHub Release $GITHUB_REF_NAME exists." >&2
            printf '%s\n' "$release_lookup" >&2
            exit 1
          fi
          if image_lookup=$(docker buildx imagetools inspect "$RELEASE_IMAGE" 2>&1); then
            echo "Container manifest $RELEASE_IMAGE already exists; choose a new version." >&2
            exit 1
          elif ! printf '%s' "$image_lookup" | grep -Eqi 'not found|manifest unknown'; then
            echo "Could not safely determine whether container manifest $RELEASE_IMAGE exists." >&2
            printf '%s\n' "$image_lookup" >&2
            exit 1
          fi

      - name: Run complete release test gate
        run: ./release/test-gate.sh "$GITHUB_REF_NAME"

      - name: Run real-browser card matrix gate
        run: npm run test:card-matrix-browser

      - name: Check production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Create standalone release bundle and checksum
        env:
          SOURCE_DATE_EPOCH: "0"
        run: node release/create-standalone-bundle.js dist

      - name: Verify standalone checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Upload validated standalone artifacts
        uses: actions/upload-artifact@v4
        with:
          name: standalone-release
          path: |
            dist/${{ steps.release.outputs.standalone_artifact }}
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release-candidate-gate:
    needs: validate
    if: needs.validate.outputs.stable != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Confirm prerelease channel
        run: test "${{ needs.validate.outputs.stable }}" = "false"

  stable-gate:
    needs: validate
    if: needs.validate.outputs.stable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: stable-release
    permissions:
      contents: read

    steps:
      - name: Check out exact stable tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate protected stable approval, manual results and repair blockers
        run: >-
          node release/check-stable-gate.js
          --version "${{ needs.validate.outputs.version }}"
          --tag "$GITHUB_REF_NAME"
          --commit "$GITHUB_SHA"
          --output stable-gate-result.json

      - name: Upload commit-bound stable gate result
        uses: actions/upload-artifact@v4
        with:
          name: stable-gate-result
          path: stable-gate-result.json
          if-no-files-found: error
          retention-days: 90

  release-gate:
    needs:
      - validate
      - release-candidate-gate
      - stable-gate
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_STABLE: ${{ needs.validate.outputs.stable }}
      RC_GATE_RESULT: ${{ needs.release-candidate-gate.result }}
      STABLE_GATE_RESULT: ${{ needs.stable-gate.result }}

    steps:
      - name: Require the matching channel gate
        run: |
          if [ "$RELEASE_STABLE" = "true" ]; then
            test "$STABLE_GATE_RESULT" = "success"
          else
            test "$RC_GATE_RESULT" = "success"
          fi

  build-images:
    needs:
      - validate
      - release-gate
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.release-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - docker_arch: amd64
            ha_arch: amd64
          - docker_arch: arm64
            ha_arch: aarch64

    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR with GitHub token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ha_legacy_dashboard/Dockerfile
          platforms: linux/${{ matrix.docker_arch }}
          push: true
          tags: >-
            ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}-${{ matrix.ha_arch }}
          build-args: |
            APP_SOURCE_PATH=ha_legacy_dashboard
            BUILD_ARCH=${{ matrix.ha_arch }}
            BUILD_VERSION=${{ needs.validate.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
          cache-from: type=gha,scope=${{ matrix.ha_arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ha_arch }}
          provenance: mode=max
          sbom: true

  publish-manifest:
    needs:
      - validate
      - build-images
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.build-images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out release validation tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR with GitHub token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish versioned multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --tag "${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}" \
            "${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}-amd64" \
            "${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}-aarch64"

      - name: Validate manifest platforms
        run: |
          docker buildx imagetools inspect \
            "${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}" \
            --raw > release-manifest.json
          node release/validate-manifest.js < release-manifest.json
          docker buildx imagetools inspect \
            "${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}" \
            > release-manifest-inspect.txt
          manifest_digest=$(sed -n 's/^Digest:[[:space:]]*//p' release-manifest-inspect.txt | head -n 1)
          printf '%s\n' "$manifest_digest" > release-manifest-digest.txt
          grep -Eq '^sha256:[0-9a-f]{64}$' release-manifest-digest.txt

      - name: Upload immutable manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-evidence
          path: |
            release-manifest.json
            release-manifest-digest.txt
          if-no-files-found: error
          retention-days: 90

  smoke-test:
    needs:
      - validate
      - publish-manifest
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.publish-manifest.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out smoke-test tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Log in to GHCR with GitHub token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull versioned multi-architecture image
        run: >-
          docker pull
          "${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}"

      - name: Run App container against localhost mock only
        run: >-
          ./release/smoke-container.sh
          "${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}"

  candidate-evidence:
    needs:
      - validate
      - publish-manifest
      - smoke-test
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.publish-manifest.result == 'success' &&
      needs.smoke-test.result == 'success' &&
      needs.validate.outputs.stable != 'true'
    permissions:
      contents: read

    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download standalone artifacts
        uses: actions/download-artifact@v4
        with:
          name: standalone-release
          path: dist

      - name: Download manifest evidence
        uses: actions/download-artifact@v4
        with:
          name: release-manifest-evidence
          path: dist

      - name: Create commit- and artifact-bound RC result
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_IMAGE: ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}
          RELEASE_ARTIFACT: ${{ needs.validate.outputs.standalone_artifact }}
        run: |
          standalone_sha=$(cut -d ' ' -f1 dist/SHA256SUMS)
          manifest_digest=$(tr -d '\r\n' < dist/release-manifest-digest.txt)
          generated_at=$(node -e 'process.stdout.write(new Date(Number(process.argv[1]) * 1000).toISOString())' "$(git show -s --format=%ct "$GITHUB_SHA")")
          node release/create-rc-result.js \
            --version "$RELEASE_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --image "$RELEASE_IMAGE" \
            --manifest-digest "$manifest_digest" \
            --standalone-artifact "$RELEASE_ARTIFACT" \
            --standalone-sha256 "$standalone_sha" \
            --workflow-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --generated-at "$generated_at" \
            --output-json dist/rc-result.json \
            --output-markdown dist/rc-result.md

      - name: Upload candidate-bound RC evidence
        uses: actions/upload-artifact@v4
        with:
          name: rc-result
          path: |
            dist/rc-result.json
            dist/rc-result.md
          if-no-files-found: error
          retention-days: 90

  publish-release:
    needs:
      - validate
      - smoke-test
      - candidate-evidence
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.smoke-test.result == 'success' &&
      (needs.validate.outputs.stable == 'true' ||
      needs.candidate-evidence.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        if: needs.validate.outputs.stable == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for stable latest tag
        if: needs.validate.outputs.stable == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish latest only after stable validation
        if: needs.validate.outputs.stable == 'true'
        run: |
          docker buildx imagetools create \
            --tag "${{ needs.validate.outputs.image }}:latest" \
            "${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}"
          docker buildx imagetools inspect \
            "${{ needs.validate.outputs.image }}:latest" \
            --raw | node release/validate-manifest.js

      - name: Download standalone artifacts
        uses: actions/download-artifact@v4
        with:
          name: standalone-release
          path: dist

      - name: Download stable gate evidence
        if: needs.validate.outputs.stable == 'true'
        uses: actions/download-artifact@v4
        with:
          name: stable-gate-result
          path: dist

      - name: Download candidate-bound RC evidence
        if: needs.validate.outputs.stable != 'true'
        uses: actions/download-artifact@v4
        with:
          name: rc-result
          path: dist

      - name: Create GitHub Release and attach checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.validate.outputs.stable }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "HA Legacy Dashboard ${{ needs.validate.outputs.version }}" \
              --notes-file "${{ needs.validate.outputs.release_notes }}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --prerelease \
              --title "HA Legacy Dashboard ${{ needs.validate.outputs.version }} – Public Test Release" \
              --notes-file "${{ needs.validate.outputs.release_notes }}"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "dist/${{ needs.validate.outputs.standalone_artifact }}" \
            dist/SHA256SUMS
          if [ "${{ needs.validate.outputs.stable }}" = "true" ]; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/stable-gate-result.json
          fi

      - name: Attach candidate-bound RC evidence
        if: needs.validate.outputs.stable != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          dist/rc-result.json
          dist/rc-result.md
