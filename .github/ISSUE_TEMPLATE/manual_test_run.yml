name: Testbericht abgeben
description: Ergebnisse aus dem Test-Center weitergeben – ein Bericht darf mehrere Tests enthalten
title: "[Testbericht]: "
body:
  - type: markdown
    attributes:
      value: |
        Diese Meldung ist öffentlich. Prüfe Bericht und Bilder zuerst auf private
        Namen, Adressen und Zugangsdaten. Lade im Test-Center deine Berichtsdatei
        herunter und hänge sie unten an. Wird .json abgelehnt, nutze .zip/.txt
        oder füge den bereinigten Dateiinhalt als Codeblock ein. Du musst ihn
        nicht selbst bearbeiten. Ohne GitHub-Konto kannst du die Datei über den
        vereinbarten Weg an deinen Ansprechpartner geben. Niemals Schlüssel,
        Passwörter, .env-Dateien oder ungeprüfte Protokolle mitschicken.
  - type: input
    id: run-id
    attributes:
      label: Berichtskennung
      description: Steht in der kopierten Zusammenfassung hinter Testbericht. Einfach übernehmen.
      placeholder: RUN-...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tatsächlich installierte HA Legacy Dashboard-Version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Womit hast du getestet?
      description: App in Home Assistant oder separater Server, Prüfgerät, Betriebssystem und Browser. Weitere Versionen und Rechnerart nur nennen, wenn bekannt. Keine privaten Adressen.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Zusammenfassung aus dem Test-Center
      description: Unter Bericht weitergeben die Zusammenfassung kopieren und hier einfügen. Nicht geprüfte Schritte zählen nicht als bestanden.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Geprüfte Berichtsdatei anhängen
      description: Heruntergeladene .json-Datei hier hineinziehen oder die Dateiauswahl benutzen. Falls nicht möglich, .zip/.txt verwenden. Vertrauliche Belege nur über einen vereinbarten privaten Weg senden.
    validations:
      required: true
  - type: textarea
    id: issues
    attributes:
      label: Schon vorhandene Fehlermeldungen – freiwillig
      description: Falls bereits gemeldet, Nummer oder Verweis nennen. Nicht für jeden erfolgreichen Test eine eigene Meldung erstellen.
  - type: checkboxes
    id: privacy
    attributes:
      label: Vor dem Absenden prüfen
      options:
        - label: Ich habe Bericht und Bilder auf Zugangsdaten und private Angaben geprüft. Nicht ausgeführte Tests sind nicht als bestanden markiert; ich beschreibe Beobachtungen statt Vermutungen.
          required: true
