name: Manual Test Run Report
description: Submit one sanitized community test run (not one Issue per PASS)
title: "[Test Run]: "
body:
  - type: markdown
    attributes:
      value: |
        Public Issue: redact secrets, private entity/person names, addresses, photos and logs.
        Validate and export JSON in the Community Test-Center first. Attach the file
        in this textarea or a comment. If .json is rejected, use .zip/.txt or paste
        redacted JSON in a fenced code block. No GitHub account? Give the JSON to
        your coordinator instead. Never include tokens, .env or private keys.
  - type: input
    id: run-id
    attributes:
      label: Test Run ID
      placeholder: RUN-...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Actually installed HA Legacy Dashboard version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: HA App or Standalone, HA Core version, architecture if known, test device, OS and browser. Aliases only; no IPs.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Run summary
      description: Paste the portal summary with catalog hash, status counts and failed Test IDs. Incomplete coverage is not PASS.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Sanitized report file or structured JSON
      description: Attach JSON (or ZIP/TXT fallback), or paste sanitized JSON as a fenced code block. Keep sensitive evidence private via an agreed channel.
    validations:
      required: true
  - type: textarea
    id: issues
    attributes:
      label: Individual bug Issues found
      description: Link existing Issues rather than creating duplicates. No automatic Issue per test.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and observation check
      options:
        - label: I reviewed all shared data for secrets and personal/private details; unexecuted tests remain NOT_TESTED and assumptions are not observations.
          required: true
