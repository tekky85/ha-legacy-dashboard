<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HA Dashboard">

<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<meta name="format-detection" content="telephone=no">

<title>
HA Legacy Dashboard
</title>

<link rel="manifest" href="/manifest.json?v=19">

<link
    rel="apple-touch-icon"
    sizes="76x76"
    href="/icons/app-icon-76.png?v=19"
>

<link
    rel="apple-touch-icon"
    sizes="120x120"
    href="/icons/app-icon-120.png?v=19"
>

<link
    rel="apple-touch-icon"
    sizes="152x152"
    href="/icons/app-icon-152.png?v=19"
>

<link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/icons/app-icon-180.png?v=19"
>

<link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="/icons/app-icon-192.png?v=19"
>

<link rel="stylesheet" href="/css/style.css?v=19">

</head>


<body>


<div class="app">

<header class="app-header">

    <div class="brand">

        <h1 id="dashboardTitle">HA Dashboard</h1>

    </div>

    <div class="wall-header">

        <div class="wall-clock" aria-label="Aktuelle Uhrzeit und Datum">
            <time id="wallClock" class="wall-clock-time">--:--</time>
            <span id="wallDate" class="wall-clock-date">Wird geladen …</span>
        </div>

        <div
            id="connectionBadge"
            class="connection-badge is-connecting"
            role="status"
            aria-live="polite"
        >
            <span class="connection-dot" aria-hidden="true"></span>
            <span id="connectionLabel" class="connection-label">Verbinde …</span>
        </div>

        <button
            id="themeButton"
            class="theme-toggle"
            type="button"
            aria-label="Darstellung wechseln"
            aria-pressed="false"
        >

        <svg
            class="theme-icon-moon"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path
                d="M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79"
            ></path>
        </svg>

        <svg
            class="theme-icon-sun"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
            <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
            <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
        </svg>

        <span
            id="themeButtonLabel"
            class="theme-toggle-label"
        >
            Dunkel
        </span>

        </button>

    </div>

</header>

<div
    id="networkBanner"
    class="network-banner"
    role="status"
    aria-live="polite"
></div>

<main id="dashboard" class="grid"></main>

<div id="updated" class="updated">
    Wird geladen …
</div>

<footer class="footer">
    HA Legacy Dashboard v1.0.0
</footer>

</div>

<script src="/js/core/compat.js?v=19"></script>
<script src="/js/core/theme.js?v=19"></script>
<script src="/js/core/icons.js?v=19"></script>
<script src="/js/core/widget.js?v=19"></script>

<script src="/js/widgets/sensor.js?v=19"></script>
<script src="/js/widgets/binary.js?v=19"></script>
<script src="/js/widgets/light.js?v=19"></script>
<script src="/js/widgets/climate.js?v=19"></script>

<script src="/js/core/layout.js?v=19"></script>
<script src="/js/core/dashboard.js?v=19"></script>
<script src="/js/app.js?v=19"></script>

</body>

</html>
