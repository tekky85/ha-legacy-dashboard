<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HA System">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<meta name="format-detection" content="telephone=no">

<title>HA Legacy Dashboard – System</title>

<link rel="stylesheet" href="/css/style.css?v=23">
<link rel="stylesheet" href="/css/system.css?v=23">

</head>

<body>

<div class="app system-app">

<header class="app-header system-header">

    <div class="brand">
        <h1 id="systemTitle">System</h1>
    </div>

    <div class="wall-header">

        <div class="wall-clock" aria-label="Aktuelle Uhrzeit und Datum">
            <time id="wallClock" class="wall-clock-time">--:--</time>
            <span id="wallDate" class="wall-clock-date">Wird geladen …</span>
        </div>

        <div
            id="connectionBadge"
            class="connection-badge is-connecting"
            role="status"
            aria-live="polite"
        >
            <span class="connection-dot" aria-hidden="true"></span>
            <span id="connectionLabel" class="connection-label">Verbinde …</span>
        </div>

        <button
            id="themeButton"
            class="theme-toggle"
            type="button"
            aria-label="Darstellung wechseln"
            aria-pressed="false"
        >

        <svg
            class="theme-icon-moon"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path
                d="M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79"
            ></path>
        </svg>

        <svg
            class="theme-icon-sun"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
            <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
            <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
        </svg>

        <span
            id="themeButtonLabel"
            class="theme-toggle-label"
        >
            Dunkel
        </span>

        </button>

    </div>

</header>

<nav class="system-navigation" aria-label="System-Dashboards">
    <a id="summaryNavigation" href="/system/summary">Summary</a>
    <a id="errorsNavigation" href="/system/errors">Systemstatus</a>
    <a href="/">Dashboard</a>
</nav>

<div
    id="networkBanner"
    class="network-banner"
    role="status"
    aria-live="polite"
></div>

<main class="system-content">

    <section class="system-card" aria-labelledby="systemCardTitle">
        <p class="system-eyebrow">Read-only Systemansicht</p>
        <h2 id="systemCardTitle">System</h2>
        <p id="systemMessage" class="system-message">Daten werden geladen …</p>

        <div id="summaryOverview" class="summary-overview" hidden>
            <div class="summary-count" aria-live="polite">
                <strong id="summaryActiveCount">0</strong>
                <span>aktiv</span>
            </div>
            <div id="summaryGroups" class="summary-groups"></div>
        </div>

        <dl class="system-meta">
            <div>
                <dt>Home Assistant</dt>
                <dd id="homeAssistantState">Wird geprüft …</dd>
            </div>
            <div>
                <dt>Erfasste Entities</dt>
                <dd id="entityCount">–</dd>
            </div>
            <div>
                <dt>Letzte erfolgreiche Erfassung</dt>
                <dd id="lastSuccessfulUpdate">Noch keine</dd>
            </div>
        </dl>
    </section>

</main>

<div id="updated" class="updated">Wird geladen …</div>

<footer class="footer">HA Legacy Dashboard v1.0.0</footer>

</div>

<script src="/js/core/compat.js?v=23"></script>
<script src="/js/core/theme.js?v=23"></script>
<script src="/js/system/common.js?v=23"></script>
<script src="/js/system/summary.js?v=23"></script>
<script src="/js/system/errors.js?v=23"></script>

</body>

</html>
